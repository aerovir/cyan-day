services:
  bot:
    build:
      context: .
    container_name: ryabov_bot
    env_file:
      - .env
    restart: unless-stopped
    # Отдельная сеть без общих подключений с другими Compose-проектами.
    networks:
      - ryabov_isolated
    volumes:
      - bot_logs:/app/logs
      - bot_state:/app/state
    # Логи бота
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_logs:
  bot_state:

networks:
  ryabov_isolated:
    name: ryabov_bot_isolated
    driver: bridge
    internal: false
    attachable: false
