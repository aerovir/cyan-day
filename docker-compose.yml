services:
  bot:
    build:
      context: .
    container_name: cyan-day
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Отдельная сеть без общих подключений с другими Compose-проектами.
    networks:
      - cyan_isolated
    volumes:
      - bot_logs:/app/logs
      - bot_state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import glob, sys; sys.exit(0 if any(b'scheduler.py' in open(path, 'rb').read() for path in glob.glob('/proc/[0-9]*/cmdline')) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  image-admin:
    profiles: ["images"]
    build:
      context: .
    entrypoint: ["python", "-m", "app.image_admin"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cyan_isolated
    volumes:
      - ./output:/app/output:rw
    healthcheck:
      disable: true


volumes:
  bot_logs:
  bot_state:

networks:
  cyan_isolated:
    name: cyan-day-isolated
    driver: bridge
    internal: false
    attachable: false
