services:
  bot:
    build: .
    container_name: ryabov_bot
    env_file:
      - .env
    restart: unless-stopped
    # Без сетевой изоляции: контейнер имеет прямой доступ к интернету
    # (VK, Mistral, calend.ru), как было решено.
    volumes:
      - bot_logs:/app/logs
    # Логи бота
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_logs:
