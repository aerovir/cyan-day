services:
  bot:
    build:
      context: .
      # Сборка в host-сети: DNS хоста резолвит pypi.org (иначе pip падает).
      network: host
    container_name: ryabov_bot
    env_file:
      - .env
    restart: unless-stopped
    # Рантайм в host-сети: bridge-NAT на машинах за серым IP/CGNAT не пропускает
    # исходящий трафик контейнера (ConnectTimeout на все сервисы).
    # В host-сети контейнер ходит в сеть как хост — работает надёжно.
    network_mode: host
    volumes:
      - bot_logs:/app/logs
      - bot_state:/app/state
    # Логи бота
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_logs:
  bot_state:
